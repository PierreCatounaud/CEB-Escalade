<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15161b"><title>Administration | CEB Escalade</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(115deg,#101116e8,#1b0b11cf),url('./DD3D0C91-C24D-468C-9713-3EFFDC895E34.jpeg') center/cover fixed;color:white;font:16px system-ui,-apple-system,Arial;display:grid;place-items:center;padding:24px}.panel{width:min(100%,440px);background:#17181eea;border:1px solid #ffffff2c;border-top:5px solid #df263d;border-radius:18px;padding:34px;box-shadow:0 20px 70px #0008}.logo{font-size:28px;font-weight:950;font-style:italic}.logo span{color:#f43b4a}h1{font-size:26px;margin:28px 0 10px}p{line-height:1.6;color:#c8c9d1}label{display:block;margin:18px 0 5px;font-weight:650}input{width:100%;padding:14px;border:1px solid #777b89;border-radius:8px;background:#242630;color:#fff;font:inherit}button{display:block;width:100%;margin:22px 0 0;background:#d51e30;border:0;color:#fff;padding:14px;border-radius:8px;font:inherit;font-weight:800;cursor:pointer}button:disabled{background:#60616b;cursor:not-allowed}a{color:#ff697b}.note{font-size:13px;border-left:3px solid #f4bd52;padding:10px 13px;background:#ffffff12;margin:18px 0}</style></head><body><main class="panel"><div class="logo">CEB <span>ESCALADE</span></div><h1>Administration du club</h1><p>Connexion réservée aux responsables autorisés.</p><form><label for="user">Identifiant</label><input id="user" autocomplete="username" placeholder="Identifiant administrateur" required><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe" required><button disabled title="L’authentification sécurisée n’est pas encore activée">Connexion bientôt disponible</button></form><p class="note">La connexion sécurisée nécessite l’activation du serveur d’authentification. Aucun identifiant n’est actuellement accepté : nous ne stockons pas de mot de passe dans le code public.</p><p><a href="./#accueil">← Retour au site CEB Escalade</a></p></main></body></html>
